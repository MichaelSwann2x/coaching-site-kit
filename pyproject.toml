[project]
name = "coaching-site-kit"
version = "0.2.0"
description = "Session slot generation and booking conflict checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[project.urls]
Source = "https://github.com/MichaelSwann2x/coaching-site-kit"
Original = "https://github.com/mirkovicdev/Simmerlund"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/coaching_site_kit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
